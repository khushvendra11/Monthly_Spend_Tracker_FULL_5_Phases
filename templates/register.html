{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="auth"><div class="authcard">
<div class="logo-big">💰 SpendTrack</div><h1>Create Account</h1>
<form method="post">
<label>Full Name</label><input name="name" required placeholder="Your name">
<label>Email</label><input name="email" type="email" required placeholder="you@example.com">
<label>Password</label><input name="password" type="password" minlength="6" required>
<label>Confirm Password</label><input name="confirm_password" type="password" minlength="6" required>
<button class="primary full">Create Account</button>
</form>
<p class="center muted">Already registered? <a href="{{url_for('login')}}">Login</a></p>
</div></div>
{% endblock %}
