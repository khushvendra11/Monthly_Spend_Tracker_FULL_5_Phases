{% extends "base.html" %}
{% block title %}{{"Edit" if transaction else "Add"}} {{mode|title}}{% endblock %}
{% block content %}
<main class="container narrow"><section class="panel">
<h1>{{"Edit" if transaction else "Add"}} {{mode|title}}</h1>
<form method="post" class="formgrid">
<div><label>Amount (₹)</label><input name="amount" type="number" step="0.01" min="0.01" required value="{{transaction['amount'] if transaction else ''}}"></div>
<div><label>Date</label><input name="transaction_date" type="date" required value="{{today}}"></div>
{% if mode=="expense" %}
<div><label>Category</label><select name="category" required>{% for c in categories %}<option {% if transaction and transaction['category']==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div>
<div><label>Payment Method</label><select name="payment_method">{% for p in payment_methods %}<option {% if transaction and transaction['payment_method']==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select></div>
{% else %}
<div class="fullrow"><label>Income Source</label><input name="source" required value="{{transaction['source'] if transaction else ''}}" placeholder="Salary, Freelance, etc."></div>
{% endif %}
<div class="fullrow"><label>Description</label><textarea name="description" rows="4">{{transaction['description'] if transaction else ''}}</textarea></div>
<div class="fullrow"><button class="primary">{{"Update" if transaction else "Save"}} {{mode|title}}</button> <a class="secondary" href="{{url_for('transactions')}}">Cancel</a></div>
</form>
</section></main>
{% endblock %}
