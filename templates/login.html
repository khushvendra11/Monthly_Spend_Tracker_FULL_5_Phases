{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="auth"><div class="authcard">
<div class="logo-big">💰 SpendTrack</div>
<h1>Welcome Back</h1><p class="muted">Your personal monthly finance tracker.</p>
<form method="post">
<label>Email</label><input name="email" type="email" required placeholder="you@example.com">
<label>Password</label><input name="password" type="password" required placeholder="Password">
<button class="primary full">Login</button>
</form>
<p class="center muted">Don't have an account? <a href="{{url_for('register')}}">Create one</a></p>
</div></div>
{% endblock %}
